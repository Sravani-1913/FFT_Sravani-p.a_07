<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    
      
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: url("./OIP\ \(2\).jpg");
        background-size: cover;
        background-position: center;
        
    }

    form {
        width: 50%;
        margin: 50px auto;
        padding: 25px;
        background-color: rgba(255, 255, 255, 0.9);
        border: 2px solid black;
        border-radius: 15px;
        box-shadow: 4px 4px 10px black;
    }

    h1 {
        background-color: rgb(128, 164, 242);
        text-align: center;
        padding: 15px;
        margin-top: 0;
        border-radius: 10px;
    }

    label {
        display: inline-block;
        width: 130px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    input {
        width: 55%;
        padding: 8px;
        border: 1px solid black;
        border-radius: 5px;
    }

    

    button {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        background-color: black;
        color: white;
        font-size: 16px;
        
    }

    button:hover {
        background-color: rgb(128, 164, 242);
        color: black;
    }

    #Para {
        margin-top: 20px;
        padding: 15px;
        background-color: rgb(245, 245, 245);
        border: 1px solid black;
        border-radius: 10px;
        line-height: 1.8;
    }

    #Para h1 {
        background-color: rgb(128, 164, 242);
        font-size: 22px;
    }


    </style>
</head>
<body>
    <!-- html----->
    <form >
        <h1>Interactive Student Result Dashboard</h1>
        <label>Student Name:</label>
        <input type="text"  name="n1" id="i1"><br><br>
          <label>Student Reg:</label>
        <input type="number" name="n2" id="i2"><br><br>
          <label>HTML Marks:</label>
        <input type="number" name="n3" id="i3"><br><br>
          <label>CSS Marks:</label>
        <input type="number" name="n4" id="i4"><br><br> 
         <label>JS Marks:</label>
        <input type="number" name="n5" id="i5"><br><br>
        <button type="button" onclick="check()">Results</button>
        <button type ="reset" onclick="check()">reset</button>
        <p id="Para"></p>
    </form> 
    <!---JAVA SCRIPT-->
    <script>
        function check(){
            let n1 = document.getElementById('i1').value;
            let n2 = document.getElementById('i2').value;
            let n3 = Number(document.getElementById('i3').value);
            let n4 = Number(document.getElementById('i4').value);
            let n5 = Number(document.getElementById('i5').value);
            let total = n3+n4+n5;
            let avg = total/3;
            let percentage = (total/300)*100;
            if (avg >=80){
                grade = "A";
            }else if(avg >=60){
                grade = "B";
            }else if(avg >=40){
                grade = "C";
            }else if(avg <40){
                grade = "D";
            }else{
                grade = "Absent";
            }
            let status;
            if(avg >=40){
                status = "Pass";
            }else{
                status = "Fail";
            }
            document.getElementById('Para').innerHTML = 
            "<h1>Student Details</h1>"+"<br>"+
            "student Name: "+n1+"<br>"+
            "student Reg: "+n2+"<br>"+
            "HTML Marks: "+n3+"<br>"+
            "CSS Marks: "+n4+"<br>"+
            "JS Marks: "+n5+"<br>"+
            "Total Marks: "+total+"<br>"+
            "Avg Marks: "+avg+"<br>"+
            "Percentage Marks: "+percentage+"%<br>"+
            "Grade: "+grade+"<br>"+
            "Status: "+status+"<br>";
      
        };
    </script>
    
</body>
</html>
