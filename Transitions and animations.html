<html>
<head>
<title>Transitions and Animations</title>

<style>

    body {
        background-color: whitesmoke;
    }

    .container {
        width: 800px;
        margin: 30px auto;
        padding: 30px;
        background-color: rgb(218, 192, 192);
        border: 3px solid rgb(27, 9, 23);
        border-radius: 20px;
        box-shadow: 0 8px 20px gray;
        text-align: center;
    }

    button {
        margin-left: 20px;
        width: 100px;
        height: 50px;
        background-color: rgb(108, 103, 186);
        border: none;
        border-radius: 50px;
        transition: 1s;
    }

    button:hover {
        background-color: rgb(208, 151, 52);
        transform: scale(1.1);
    }

    .b1 {
        width: 100px;
        height: 50px;
        background-color: rgb(224, 41, 188);
        border: none;
        border-radius: 3px;
        transition: 1s;
    }

    .b1:hover {
        background-color: rgb(168, 92, 240);
        transform: scale(1.1);
    }

    .b2 {
        width: 100px;
        height: 50px;
        background-color: rgb(233, 214, 11);
        border: none;
        border-radius: 7px;
        transition: 1s;
    }

    .b2:hover {
        background-color: rgb(64, 62, 62);
        transform: scale(1.1);
    }

    .b3 {
        width: 100px;
        height: 50px;
        background-color: rgb(237, 37, 47);
        border: none;
        border-radius: 70px;
        transition: 1s;
    }

    .b3:hover {
        background-color: bisque;
        transform: scale(1.1);
    }

    .box {
        width: 150px;
        height: 150px;
        background-color: rgb(96, 240, 135);
        margin: auto;
        animation: sravani 1s ease alternate infinite;
    }

    .box2 {
        margin: auto;
        width: 100px;
        height: 100px;
        background-color: rgb(231, 100, 109);
        border-radius: 100%;
        animation: hello 3s ease-out 2s alternate infinite;
    }

    
    .load {
        margin: auto;
        width: 100px;
        height: 100px;
        border: 5px solid gray;
        border-radius: 50%;
        border-top: solid blue;
        animation: spin 1s linear infinite;
    }

    .load1 {
        margin: auto;
        width: 100px;
        height: 100px;
        border: 10px solid rgb(186, 70, 161);
        border-radius: 1%;
        border-top: solid rgb(213, 215, 57);
        animation: spin1 1s linear infinite;
    }

    /* Triangle */

    .triangle {
        margin: auto;
        width: 0;
        height: 0;
        border-left: 60px solid transparent;
        border-right: 60px solid transparent;
        border-bottom: 100px solid rgb(168, 92, 240);
        animation: triangle 2s ease-in-out alternate infinite;
    }

    /* Ellipse */

    .ellipse {
        margin: auto;
        width: 180px;
        height: 100px;
        background-color: orange;
        border-radius: 50%;
        animation: ellipse 2s ease-in-out alternate infinite;
    }

    /* Diamond */

    .diamond {
        margin: 30px auto;
        width: 100px;
        height: 100px;
        background-color: rgb(37, 209, 106);
        transform: rotate(45deg);
        animation: diamond 2s ease-in-out alternate infinite;
    }

    /* Oval */

    .oval {
        margin: auto;
        width: 200px;
        height: 80px;
        background-color: rgb(37, 150, 209);
        border-radius: 50%;
        animation: oval 2s ease-in-out alternate infinite;
    }

    /* Star */

    .star {
        margin: 30px auto;
        width: 0;
        height: 0;
        border-left: 50px solid transparent;
        border-right: 50px solid transparent;
        border-bottom: 100px solid rgb(237, 37, 47);
        position: relative;
        animation: star 2s linear infinite;
    }

    .star:after {
        content: "";
        position: absolute;
        left: -50px;
        top: 30px;
        width: 0;
        height: 0;
        border-left: 50px solid transparent;
        border-right: 50px solid transparent;
        border-top: 100px solid rgb(237, 37, 47);
    }

    /* Animations */

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    @keyframes spin1 {
        to {
            transform: rotate(360deg);
        }
    }

    @keyframes bye {
        to {
            transform: rotate(360deg);
        }
    }

    @keyframes hi {
        to {
            transform: rotate(90deg);
        }
    }

    @keyframes hello {
        to {
            transform: scale(0);
        }
    }

    @keyframes sravani {
        from {
            transform: scale(0.5);
        }

        to {
            transform: scale(1);
        }
    }

    @keyframes triangle {
        from {
            transform: translateX(-40px);
        }

        to {
            transform: translateX(40px);
        }
    }

    @keyframes ellipse {
        from {
            transform: scaleX(1);
        }

        to {
            transform: scaleX(1.4);
        }
    }

    @keyframes diamond {
        from {
            transform: rotate(45deg) scale(1);
        }

        to {
            transform: rotate(225deg) scale(1.2);
        }
    }

    @keyframes oval {
        from {
            transform: translateX(-50px);
        }

        to {
            transform: translateX(50px);
        }
    }

    @keyframes star {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

</style>

</head>

<body>

<div class="container">

    <h1>Transitions & Animations</h1>

    <h2>Transitions</h2>

    <button>Action</button>
    <button class="b1">Action</button>
    <button class="b2">Action</button>
    <button class="b3">Action</button>

    <br><br>
    <br><br>

    <h2>Animations</h2>

    <div class="box"></div>

    <br><br>

    <div class="box2"></div>

    <br><br>

    

    <div class="load"></div>

    <br><br>

    <div class="load1"></div>

    <br><br>

    

    <h2>Triangle</h2>

    <div class="triangle"></div>

    <br><br>

    <h3>Ellipse</h3>

    <div class="ellipse"></div>

    <br><br>

    <h4>Diamond</h4>

    <div class="diamond"></div>

    <br><br>

    <h5>Oval</h5>

    <div class="oval"></div>

    <br><br>

    <h6>Star</h6>

    <div class="star"></div>

</div>

</body>
</html>
